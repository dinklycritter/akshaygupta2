<!DOCTYPE html>

<!reminders for me: tables use style.display="table">
<!what to do if code is not working: check update function, check onclick, check ;, check spelling of variables and stupid commands>
<html>
  <head>
    <style>
      table, td {
        border: 1px solid black;
        padding: 3.5px;
      }
    </style>
    <title>bill's adventure</title>
      <script>

        //my variables :)
        let turn = 0, minimum = 0, maximum = 2, pp = 0, added = 0, mormons = 5, dong = 0;
        //checkers
        let dongshopopen = 0;
        //stock market
        let stockname1 = "", stockname2 = "", stockname3 = "", stockprice1 = "", stockprice2 = "", stockprice3 = "", stockquality1 = "", stockquality2 = "", stockquality3 = "";
        //const variables (NOT TABLES!!)
        const tvprice = 20, floodcost = 100, doortodoorprice = 10, cheapstockmin = 8, cheapstockmax = 55, midstockmin = 50, midstockmax = 140, beststockmin = 120, beststockmax = 200;
        //const variables (TABLES!!!!)
        const good = ["bill posted a fire meme to mr clean.", "bill used logical fallacies to gain more followers and nobody noticed.", "bill has immense aura.", "bill has become extremely popular", "the cardinals begin to notice bill as a potential candidate for pope.", "gerald ford rose from the grave to go support bill in his pursue for pope.", "bill got free sourcream.", "bill has gained a golden play button."];
        const bad = ["bill fumbled hard and got little followers.", "bill used logical fallacies, but someone pointed it out.", "bill posted unfunny memes to mr clean.", "someone told bill to stop spamming reply all to the email thread, but others thought it was pretty funny.", "bill added a certain someone to the email thread.", "bill forgot the accent.", "bill barely survived the nether."];
        const mid = ["bill has been declared mid by the masses.", "bill is neither good nor bad.", "bill is mid.", "bill sold oatmeal raisin cookies.", "bill got eyes in the back of his head.", "bill got 3 stacks of armadillo scute."];
        const zero = ["NOBODY CARES ABOUT BILL!!", "bill did not gain any supporters.", "bill attempted to promote his pope stuff, but people didn't care.", "bill retains his previous following.", "crickets...", "bill's videos never went viral, but it was all a dream."];
        const negative = ["i pooped my pants.", "what did bill do bro he lost followers.", "THE PEOPLE HATE BILL!!!!", "bill fell asleep and when he woke up, everyone was gone.", "bill got tariffed :(.", "bill contracted bubonic plague.", "bill got dried cranberries.", "bill has been arrested on four counts of tax fraud."];
        const doortodoormessage = ["messangers have been sent to go spread the word of bill, though some people find them annoying.", "bill is a latter day saint.", "bill has released the jehovah's witnesses.", "the door to door salesmen are promoting bill for sure, but too much of them might make people mad.", "bill is contacting people about their cars' extended warranty."];
        const dongacquire = ["dong acquired!", "hay dong en la casa.", "bill has been put on a hit list.", "diddy inheritance found!", "+100 social credit."];
        const tvmessage = ["there are now fire bill ads airing on tv.", "bill awareness increased.", "bill has eyes in the back of his eyes.", "akshay gupta.", "moowah bill !"];
        const openstockmarketmessage = ["bill has hedge funds.", "bill participated in capitalism."]
        const stockcompanies = ["oil refinery co.", "dean inc.", "goons associate", "former nation of czechoslovakia", "sandwich-a-rama sandwich store", "pikmin 3 deluxe", "fish", "WSB", "tsmc", "crashout & co", "joe's ice cream", "loblaw companies ltd.", "isnack 2.0", "boeing co", "2 kilo...", "zinc workers united", "freerobux.com", "down yonder ltd.", "canes arcade", "CAASPP testing", "the library of letourneau", "spöök tube", "get faded LLC", "hocotate freight"];
        const stockqualities = ["excellant", "good", "mid", "bad", "horrible"];

        function updatestocks() {
          //update names
          var companylist = [...stockcompanies]; //creates a shallow copy
          var randomadd = Math.floor(Math.random() * (companylist.length));
          stockname1 = companylist.splice(randomadd, 1)[0]; //splices and returns spliced
          randomadd = Math.floor(Math.random() * (companylist.length));
          stockname2 = companylist.splice(randomadd, 1)[0];
          randomadd = Math.floor(Math.random() * (companylist.length));
          stockname3 = companylist.splice(randomadd, 1)[0];
          //update prices
          var randomprice = Math.floor(Math.random() * (cheapstockmax - cheapstockmin));
          stockprice1 = ((randomprice * 10) + cheapstockmin * 10);
          randomprice = Math.floor(Math.random() * (midstockmax - midstockmin));
          stockprice2 = ((randomprice * 10) + midstockmin * 10);
          randomprice = Math.floor(Math.random() * (beststockmax - beststockmin));
          stockprice3 = ((randomprice * 10) + beststockmin * 10);
          //update qualities
          var randomquality = Math.floor(Math.random() * (stockqualities.length));
          stockquality1 = (randomquality * 1);
          randomquality = Math.floor(Math.random() * (stockqualities.length));
          stockquality2 = (randomquality * 1);
          //write to the table
          document.getElementById("stock1").innerHTML = `${stockname1}<br/>${stockprice1}`;
          document.getElementById("stock2").innerHTML = `${stockname2}<br/>${stockprice2}`;
          document.getElementById("stock3").innerHTML = `${stockname3}<br/>${stockprice3}`;

          //later for stocks!!!
          //sell prices will be according to the price of the stock
          //dividend prices will be a fixed amount for cheap, mid and best stocks
        }

        function campaignmessage() {
          var halfall = (maximum/2 + minimum);
          
          if (added === 0) {
            var randomadd = Math.floor(Math.random() * (zero.length));
            document.getElementById("status").innerHTML = zero[randomadd];
          } else if (added < 0) {
            var randomadd = Math.floor(Math.random() * (negative.length));
            document.getElementById("status").innerHTML = negative[randomadd];
          } else if (added === halfall) {
            var randomadd = Math.floor(Math.random() * (mid.length));
            document.getElementById("status").innerHTML = mid[randomadd];
          } else if (added > halfall) {
            var randomadd = Math.floor(Math.random() * (good.length));
            document.getElementById("status").innerHTML = good[randomadd];
          } else if (added < halfall) {
            var randomadd = Math.floor(Math.random() * (bad.length));
            document.getElementById("status").innerHTML = bad[randomadd];
          }
        }
        
        function update() {
          turn = (turn + 1);
          document.getElementById("ppcounter").innerHTML = "popularity points (pp): " + pp;
           document.getElementById("turncounter").innerHTML = "turns: " + turn;
          document.getElementById("dongcounter").innerHTML = "vietnamese dong: " + dong;
          updatestocks()
        }

        function campaign() {
          var real = (Math.random() * (maximum + 1));
          var actual = (Math.floor(real));
          var realmente = (actual + minimum);
          added = realmente;
          pp = (pp + realmente);
          

          campaignmessage();
          update();
        }

        function sellfordong() {
          if (pp >= 1) {
            dong = (dong + (pp * 2));
            pp = 0;
            if (dongshopopen === 0) {
              document.getElementById("dongcounter").style.display = "block";
              document.getElementById("dongh3").style.display = "block";
              document.getElementById("donghr").style.display = "block";
              document.getElementById("dongadget").style.display = "block";
              document.getElementById("openstocks").style.display = "block";
              document.getElementById("dongdong").style.display = "block";
              dongshopopen = 500
            }
            
            update();
            var randomadd = Math.floor(Math.random() * (dongacquire.length));
            document.getElementById("status").innerHTML = dongacquire[randomadd];
          }
        }

        function tvad() {
          if (dong >= tvprice) {
            dong = (dong - tvprice);
            minimum = (minimum + 1);

            var randomadd = Math.floor(Math.random() * (tvmessage.length));
            document.getElementById("status").innerHTML = tvmessage[randomadd];

            update();
          }
        }

        function doortodoor() {
          if (pp >= doortodoorprice) {
            pp = (pp - doortodoorprice);
            minimum = (minimum - 1);
            maximum = (maximum + mormons);
            mormons = (mormons - 1);

            var randomadd = Math.floor(Math.random() * (doortodoormessage.length));
            document.getElementById("status").innerHTML = doortodoormessage[randomadd];
            
            update();
          }
        }

        function openfloodgates() {
          if (dong >= floodcost) {
            dong = (dong - floodcost);
            document.getElementById("openstocks").style.display = "none";
            document.getElementById("stockh3").style.display = "block";
            document.getElementById("stockhr").style.display = "block";
            document.getElementById("stockstable").style.display = "table";

            var randomadd = Math.floor(Math.random() * (openstockmarketmessage.length));
            document.getElementById("cstatus").innerHTML = openstockmarketmessage[randomadd];
            update()
          }
        }
      </script>
  </head>
  <body>
    <h1>bill for pope</h1>
    <img src="billforpope.png" title="mwah bill" style="width:124px">

    <p id="turncounter">turns: 0</p>
    <p id="ppcounter">popularity points (pp): 0</p>
    <p style="display:none" id="dongcounter">vietnamese dong: 0</p>
    <br>
    <p id="status">get bill to pope in 100 turns</p>
    <br>
    <button id="campaignbutton" onclick="campaign()">campaign for bill</button>
    <hr />
    <h3>pp shop</h3>
    <button id="door" onclick="doortodoor()">campaign door to door (10 pp)</button>
    <br>
    <p style="display:block"> </p>
    <button id="sell" onclick="sellfordong()">sell all your followers (2 dong per 1 pp)</button>
    <hr />
    
    <!dong shop>
    <h3 id="dongh3" style="display:none">dong shop</h3>
    <button id="dongadget" onclick="tvad()" style="display:none">television advertisement (20 dong)</button>
    <p id="dongdong" style="display:none"> </p>
    <button id="openstocks" style="display:none" onclick="openfloodgates()">open the stock market (100 dong)</button>
    <hr id="donghr" style="display:none"/>

    <!stock market>
    <h3 id="stockh3" style="display:none">stock market</h3>
    
    <table id="stockstable" style="display:none">
      <tr>
        <td id="stock1">stock 1</td>
        <td id="stock2">stock 2</td>
        <td id="stock3">stock 3</td>
      </tr>
    </table>
    
    <hr id="stockhr" style="display:none"/>

  </body>
</html>
