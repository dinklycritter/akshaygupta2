<!DOCTYPE html>
<html>
  <head>
    <title>rodentia taxonomic order <333</title>
    
    <style>
      
      #stickybar {
        position: sticky;
        top: 0;
        overflow: scroll;
        background-color: slateblue;
      }

      #bottombar {
        position:absolute; bottom:0px;
        padding:20px 10px;
      }
      
      #stickybar a {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }

      #stickybar b {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 11px 16px;
        text-decoration: none;
        font-size: 20px;
      }

      #nutriaimage {
        width: 500px;
        height:375px;
        float: left;
        padding: 10px 10px;
        cursor: pointer;
      }

      #nutriaimage:hover {
        filter: brightness(75%);
      }

      .options .q {
        display: flow-root;
        text-align: center;
        margin-top: 10px;
        text-decoration: none;
        padding: 20px 5px;
        font-size: 17px;
        cursor: pointer;

        border-width: 2px;
        border-style: double;
        border-radius: 5px;
      }

      .options .q:hover {
        background-color: grey;
      }

      #popups a {
        font-size: 20px;
        position: absolute;
        top: 10%;
        left: 10%;
      }
      
    </style>

    <script>
      //points should be nutria currency
      //be able to click the nutria at the start, but slowly nerf clicking in favor of afk auto gen for different minigames
      //send nutria out on expeditions to different habitats, unlock related species
      //loot crates for fossils (have choices on different genus fossils, fossils add to auto)
      //stock market for rodentia diet

      var np = 0; var nutrias = 0;
      var nutriaprice = 40;

      function updatescreen() {
        document.getElementById("jpdisplay").innerHTML = "nutria points: " + np;
        document.getElementById("nutriadisplay").innerHTML = "nutrias: " + nutrias;
        document.getElementById("buynutriabutton").innerHTML = "buy a nutria (" + nutriaprice + " np)";
      }

      setInterval(function () {
        np = np + nutrias;
        var popup = document.createElement("a");

        if (nutrias > 0) {
          popup.innerHTML = "+" + (nutrias) + " np";
          document.getElementById("popups").appendChild(popup);
        }

        var goal = 20
        id = null;
        clearInterval(id);
        id = setInterval(frame, 30);
        function frame() {
          if (goal < 0.2) {
            clearInterval(id);
            document.getElementById("popups").removeChild(document.getElementById("popups").firstChild);
            popup = null;
          } else {
            popup.style.top = (popup.getBoundingClientRect().top + goal) + "px";
            goal = goal/1.2;
          }
        }
        
        updatescreen();
      }, 1000);

      function clicknutria() {
        np++;
        updatescreen();
      }

      function buynutria() {
        if (np >= nutriaprice) {
          np = np - nutriaprice;
          nutriaprice = Math.floor(nutriaprice * 1.15);
          nutrias++;
          updatescreen();
        }
      }
    </script>
    
  </head>
  <body>
    
    <div id="stickybar">
      <b id="titlea">nutria game</b>
      <a id="jpdisplay">nutria points: 0</a>
      <a id="nutriadisplay">nutrias: 0</a>
    </div>

    <div onclick="clicknutria()">
      <img id="nutriaimage" src="nutriapng.png" alt="nutria" title="myocaster coypus">
    </div>
    <!-- img_girl.jpg -->

    <div id="popups"></div>

    <div class="options">
      <a id="buynutriabutton" class="q" onclick="buynutria()">buy a nutria (40 np)</a>
      <a id="buyhabitatbutton" class="q">buy habitat</a>
      <a id="buyfossilsbutton" class="q">buy fossils</a>
      <a id="buyspeciesbutton" class="q">buy related species</a>
    </div>

    <div id="bottombar">
      <a href="https://dinklycritter.github.io/akshaygupta2/">return to akshay</a>
    </div>
  
  </body>
</html>
