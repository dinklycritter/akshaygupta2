<!DOCTYPE html>
<html>
  <head>
    <title>rodentia taxonomic order <333</title>
    
    <style>
      
      #stickybar {
        position: sticky;
        top: 0;
        overflow: scroll;
        background-color: slateblue;
      }

      #bottombar {
        position:absolute; bottom:0px;
        padding:20px 10px;
      }
      
      #stickybar a {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }

      #stickybar b {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 11px 16px;
        text-decoration: none;
        font-size: 20px;
      }

      #nutriaimage {
        width: 500px;
        height:375px;
        float: left;
        margin-top: 10px;
      }

      #options #options {
        display: flow-root;
        text-align: center;
        margin-top: 10px;
        text-decoration: none;
        padding: 20px 5px;
        font-size: 17px;

        border-width: 2px;
        border-style: double;
        border-radius: 5px;
      }
      
    </style>

    <script>
      //points should be nutria currency
      //be able to click the nutria at the start, but slowly nerf clicking in favor of afk auto gen for different minigames
      //send nutria out on expeditions to different habitats, unlock related species
      //loot crates for fossils (have choices on different genus fossils, fossils add to auto)
      //stock market for rodentia diet

      var np = 0;

      function updatescreen() {
        document.getElementById("boughtstock").innerHTML = "nutria points: " + np;
      }

      function clicknutria() {
        np++;
        updatescreen();
      }
    </script>
    
  </head>
  <body>
    
    <div id="stickybar">
      <b id="titlea">nutria game</b>
      <a id="jpdisplay">nutria points: 0</a>
    </div>

    <img id="nutriaimage" src="nutriapng.png" alt="nutria" title="myocaster coypus" onclick="clicknutria()">

    <div id="options">
      <a id="options">buy nutria</a>
      <a id="options">buy habitat</a>
      <a id="options">buy fossils</a>
      <a id="options">buy related species</a>
    </div>

    <div id="bottombar">
      <a href="https://dinklycritter.github.io/akshaygupta2/">return to akshay</a>
    </div>
  
  </body>
</html>
