<!DOCTYPE html>
<html>
  <head>
    <title>rodentia taxonomic order <333</title>
    
    <style>
      
      #stickybar {
        position: sticky;
        top: 0;
        overflow: scroll;
        background-color: slateblue;
      }

      #bottombar {
        position:absolute; bottom:0px;
        padding:20px 10px;
      }
      
      #stickybar a {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }

      #stickybar b {
        float: left;
        display: block;
        color: #ffffff;
        text-align: center;
        padding: 11px 16px;
        text-decoration: none;
        font-size: 20px;
      }

      #nutriaimage {
        width: 500px;
        height:375px;
        float: left;
        padding: 10px 10px;
        cursor: pointer;
      }

      #nutriaimage:hover {
        filter: brightness(75%);
      }

      #nutriaimage:active {
        filter: brightness(100%);
      }

      .options .q {
        display: flow-root;
        text-align: center;
        margin-top: 10px;
        text-decoration: none;
        padding: 20px 5px;
        font-size: 17px;
        cursor: pointer;

        border-width: 2px;
        border-style: double;
        border-radius: 5px;
      }

      .options .q:hover {
        background-color: silver;
      }

      #popups a {
        font-size: 20px;
        -webkit-text-stroke: 4px white;
        paint-order: stroke fill;
        position: absolute;
        top: 10%;
        left: 10%;
      }

      #worldmap {
        width: 800px;
        height:404px;
        padding: 10px 10px;
        display: none;
        margin-left: auto;
        margin-right: auto;
      }

      #stickybar #multdisplay {
        display: none;
      }
      
    </style>

    <script>
      //points should be nutria currency
      //be able to click the nutria at the start, but slowly nerf clicking in favor of afk auto gen for different minigames
      //send nutria out on expeditions to different habitats, unlock related species
      //loot crates for fossils (have choices on different genus fossils, fossils add to auto)
      //stock market for rodentia diet

      var np = 0; var nutrias = 0; var multi = 1;
      var nutriaprice = 40; const mapprice = 120; const treeratprice = 340;
      const pricehike = 1.15;

      function updatescreen() {
        document.getElementById("jpdisplay").innerHTML = "nutria points: " + np;
        document.getElementById("nutriadisplay").innerHTML = "nutrias: " + nutrias;
        document.getElementById("buynutriabutton").innerHTML = "buy a nutria (" + nutriaprice + " np)";
      }

      setInterval(function () {
        
        if (nutrias > 0) {
          var nppsamount = Math.floor(nutrias);
          
          if (nppsamount > 0) {

            if (!document.hidden) {
              makepopup(nppsamount);
              np = np + nppsamount;
            }
          }
        }
        updatescreen();
      }, 1000);
      
      function makepopup(amount) {
        var popup = document.createElement("a");
        popup.innerHTML = "+" + amount + " np";
        document.getElementById("popups").appendChild(popup);
      
        var goal = 20;
        var loop = setInterval(function() {
          if (goal < 0.2) {
            clearInterval(loop);
            document.getElementById("popups").removeChild(document.getElementById("popups").firstChild);
          } else {
            popup.style.top = (popup.getBoundingClientRect().top + goal) + "px";
            goal = goal / 1.2;
          }
        }, 30);
      }

      function clicknutria() {
        np++;
        updatescreen();nutria
      }

      function buynutria() {
        if (np >= nutriaprice) {
          np = np - nutriaprice;
          nutriaprice = Math.floor(nutriaprice * pricehike);
          nutrias++;
          updatescreen();
        }
      }

      function buymap() {
        if (np >= mapprice) {
          np = np - mapprice;
          document.getElementById("buymap").style.display = "none";
          document.getElementById("worldmap").style.display = "block";

          updatescreen();
        }
      }

      function buytreerat() {
        if (np >= treeratprice) {
          np = np - treeratprice;
          multi = multi + 0.5;
          document.getElementById("buyspeciesbutton").style.display = "none";
          document.getElementById("buyspeciesbutton2").style.display = "block";
          document.getElementById("nutriaimage").src = "nutriatreerat.png";

          updatescreen();
        }
      }
    </script>
    
  </head>
  <body>
    
    <div id="stickybar">
      <b id="titlea">nutria game</b>
      <a id="jpdisplay">nutria points: 0</a>
      <a id="nutriadisplay">nutrias: 0</a>
      <a id="multdisplay">mult: 1</a>
    </div>

    <div onclick="clicknutria()">
      <img id="nutriaimage" src="nutriapng.png" alt="nutria" title="myocaster coypus">
    </div>
    <!-- img_girl.jpg -->

    <div id="popups"></div>

    <div class="options">
      <a id="buynutriabutton" class="q" onclick="buynutria()">buy a nutria (40 np)</a>
      <a id="buymap" class="q" onclick="buymap()">unlock world map (120 np)</a>
      <a id="buyfossilsbutton" class="q">buy fossils (20 nutria)</a>
      <a id="buyspeciesbutton" class="q" onclick="buytreerat()">unlock painted tree rats (800 np)</a>
      <a id="buyspeciesbutton2" class="q" onclick="buytreerat()" style="display:none">unlock armored rats (6400 np)</a>
    </div>

    <img id="worldmap" src="worldmap.PNG" alt="world map">

    <div id="bottombar">
      <a href="https://dinklycritter.github.io/akshaygupta2/">return to akshay</a>
    </div>
  
  </body>
</html>
