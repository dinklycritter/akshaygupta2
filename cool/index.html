<!DOCTYPE html>
<html>
  <head>
    <title>click</title>
      <script>
        let perclick = 1, amount = 0; price = 50; pricemulti = 500; multi = 1; fullclick = 1;
      function clicked() {
        fullclick = (perclick * multi);
        amount = (Math.floor(amount + fullclick));
        document.getElementById("amount").innerHTML = amount;
        document.getElementById("extra").innerHTML = "extra clicks: " + (perclick - 1);
      }

      function purchase() {
        if (amount >= price) {
          amount -= price;
          perclick = (perclick + 1);
          document.getElementById("amount").innerHTML = amount;
          document.getElementById("extra").innerHTML = "extra clicks: " + (perclick - 1);
        }
      }

      function purchasemulti() {
        if (amount >= pricemulti) {
          amount -= pricemulti;
          multi = ((Math.floor((multi + 0.1)*10))/10);
          document.getElementById("amount").innerHTML = amount;
          document.getElementById("multi").innerHTML = "multi: " + (multi) + "x";
        }
      }
      </script>
  </head>
  <body>

    <button onclick="clicked()" title="click for clicks">hey guys</button>
    <p id="amount">amount of your stuffs</p>
    
    <hr />
    <h3>shop</h3>
    
    <button onclick="purchase()">extra clicks (you need 50 hey guys)</button>
    <p id="extra">extra clicks: 0</p>
    <button onclick="purchasemulti()">0.1x multi (you need 500 hey guys)</button>
    <p id="multi">multi: 1x</p>
